    <!-- Global Performance Engine, Clean Unregistration & Graceful Auth Error Shield -->
    <script>
      (function() {
        'use strict';

        // 1. Unregister any legacy ServiceWorker & clear old caches to eliminate 404 loops
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister().catch(function() {});
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
              for (var j = 0; j < cacheNames.length; j++) {
                caches.delete(cacheNames[j]).catch(function() {});
              }
            }).catch(function() {});
          }
        } catch (e) {}

        // 2. Graceful Error & Promise Rejection Shield (Catches Firebase Unauthorized Domain & Cross-Origin Auth without console crashing)
        window.addEventListener('unhandledrejection', function(event) {
          if (!event || !event.reason) return;
          var reasonStr = (event.reason.message || event.reason.code || String(event.reason)).toLowerCase();
          
          // Suppress known benign Firebase Auth / Network / Domain restrictions
          if (
            reasonStr.indexOf('auth/unauthorized-domain') !== -1 ||
            reasonStr.indexOf('auth/popup-closed-by-user') !== -1 ||
            reasonStr.indexOf('auth/cancelled-popup-request') !== -1 ||
            reasonStr.indexOf('auth/popup-blocked') !== -1 ||
            reasonStr.indexOf('firestore/permission-denied') !== -1 ||
            reasonStr.indexOf('service worker') !== -1 ||
            reasonStr.indexOf('sw.js') !== -1
          ) {
            event.preventDefault(); // Stop red error in browser console
          }
        });

        window.addEventListener('error', function(event) {
          if (!event || !event.message) return;
          var msg = String(event.message).toLowerCase();
          if (
            msg.indexOf('sw.js') !== -1 ||
            msg.indexOf('serviceworker') !== -1 ||
            msg.indexOf('auth/unauthorized-domain') !== -1
          ) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
