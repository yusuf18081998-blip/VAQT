<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberClockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#6366f1" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="64" height="64" rx="18" fill="#030712" />
  
  <!-- Outer Neon Ring -->
  <circle cx="32" cy="32" r="24" fill="#0f172a" stroke="url(#cyberClockGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Clock Ticks -->
  <circle cx="32" cy="13" r="1.5" fill="#38bdf8" />
  <circle cx="51" cy="32" r="1.5" fill="#ec4899" />
  <circle cx="32" cy="51" r="1.5" fill="#38bdf8" />
  <circle cx="13" cy="32" r="1.5" fill="#a855f7" />
  
  <!-- Clock Hands -->
  <!-- Hour hand pointing towards 10 o'clock -->
  <line x1="32" y1="32" x2="22" y2="20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Minute hand pointing towards 2 o'clock -->
  <line x1="32" y1="32" x2="44" y2="19" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Second hand (accent pink dot) -->
  <line x1="32" y1="32" x2="32" y2="44" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
</svg>
