<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#030712"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#bgGrad)" stroke-width="18" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="#0f172a" stroke="url(#bgGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="256" stroke="#ec4899" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  
  <!-- 3D cyber ticks -->
  <circle cx="256" cy="116" r="8" fill="#38bdf8" />
  <circle cx="396" cy="256" r="8" fill="#ec4899" />
  <circle cx="256" cy="396" r="8" fill="#818cf8" />
  <circle cx="116" cy="256" r="8" fill="#a855f7" />
</svg>
